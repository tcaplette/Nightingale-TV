# Jellyfin, Emby and Plex test servers for development (see test_servers.sh),
# and a fake tuner for Live TV. Run one server at a time. Media is generated by make_media.sh and mounted
# read-only; server data lives under ~/.cache/nightingale-test-servers.
name: nightingale-test-servers

services:
  # Looping test channels as M3U + XMLTV and as an HDHomeRun (fake_tuner.py).
  # Jellyfin and Emby reach it as fake-tuner:5104, Plex (host network) and
  # the app as 127.0.0.1:5104, the emulator as 10.0.2.2:5104.
  fake-tuner:
    build: ./fake_tuner
    image: nightingale-fake-tuner
    profiles: [tuner]
    container_name: nightingale-fake-tuner
    ports:
      - "5104:5104"
    volumes:
      - ${TEST_SERVERS_DATA}/fake-tuner:/data
    restart: "no"

  jellyfin:
    image: jellyfin/jellyfin:12.2.20261005-225228
    profiles: [jellyfin]
    container_name: nightingale-jellyfin
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8097:8096"
    volumes:
      - ${TEST_SERVERS_DATA}/jellyfin/config:/config
      - ${TEST_SERVERS_DATA}/jellyfin/cache:/cache
      - ${TEST_MEDIA}:/media:ro
    restart: "no"

  emby:
    image: emby/embyserver:4.10.2.0
    profiles: [emby]
    container_name: nightingale-emby
    environment:
      UID: "${HOST_UID:-1000}"
      GID: "${HOST_GID:-1000}"
    ports:
      - "8096:8096"
    volumes:
      - ${TEST_SERVERS_DATA}/emby:/config
      - ${TEST_MEDIA}:/media:ro
    restart: "no"

  plex:
    image: plexinc/pms-docker:1.43.5.11029-6bf8af3f0
    profiles: [plex]
    container_name: nightingale-plex
    # Host network: Linux clients and the emulator (10.0.2.2) reach it as a
    # local server, so Plex never routes them through its relay.
    network_mode: host
    environment:
      PLEX_UID: "${HOST_UID:-1000}"
      PLEX_GID: "${HOST_GID:-1000}"
      PLEX_CLAIM: "${PLEX_CLAIM:-}"
      # Lets the setup script (and API checks) talk to the server from this
      # machine before it's claimed.
      ALLOWED_NETWORKS: "127.0.0.1/32"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${TEST_SERVERS_DATA}/plex:/config
      - ${TEST_SERVERS_DATA}/plex-transcode:/transcode
      - ${TEST_MEDIA}:/media:ro
    restart: "no"
