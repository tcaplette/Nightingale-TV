# Builds the Linux version of Nightingale TV for a release, with the web
# admin, and attaches it to that release, as
# nightingale-tv-linux-x64-<version>.tar.gz (and its .sha256). Then builds
# the Docker image (docker/), which downloads that file, and publishes it to
# GitHub's registry as ghcr.io/<owner>/nightingale-tv-server:<version> and
# :latest.
#
# Runs when a version tag is pushed (or a release is created with a new tag
# on GitHub). For an existing tag: Actions → Linux release → Run workflow.
# It's built on Ubuntu 24.04, the same release the Docker image runs on, so
# its libraries (GTK, libmpv2) match.
name: Linux release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.1.0 (1.1.0 works too)
        required: true

permissions:
  contents: write

jobs:
  # The tag as typed by hand: spaces trimmed, "v" added if left off, and
  # checked to exist, so a typo fails here with a plain message.
  tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        env:
          INPUT: ${{ github.event.inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          T="$(printf '%s' "$INPUT" | tr -d '[:space:]')"
          [[ "$T" == v* ]] || T="v$T"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$T" >/dev/null 2>&1; then
            echo "::error::There's no tag \"$T\" in this repository (typed: \"$INPUT\"). Use a release's tag, e.g. v1.1.0."
            exit 1
          fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          echo "version=${T#v}" >> "$GITHUB_OUTPUT"
          echo "Building $T"

  linux:
    needs: tag
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable

      # The Linux app with the web admin in its web/ folder; fails when the
      # web admin doesn't build.
      - name: Build and package
        run: |
          flutter pub get --enforce-lockfile
          tool/build_linux_release.sh "$VERSION"
          echo "FILE=dist/nightingale-tv-linux-x64-${VERSION}.tar.gz" >> "$GITHUB_ENV"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes ""
          gh release upload "$TAG" "$FILE" "$FILE.sha256" --clobber

  # The server image, made from the Linux release just attached.
  image:
    needs: [tag, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nightingale-tv-server" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          build-args: NTV_VERSION=${{ env.VERSION }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
