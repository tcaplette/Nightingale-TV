# Builds the image and publishes it to GitHub's registry:
#   ghcr.io/<owner>/nightingale-tv-server:<version> and :latest
#
# Runs when a version tag is pushed here. The tag is the Nightingale TV
# version the image is made from, whose Linux release must already be
# published:  git tag v1.1.0 && git push origin v1.1.0
name: Publish image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Nightingale TV version (e.g. 1.1.0)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          V="${{ github.event.inputs.version }}"
          [ -n "$V" ] || V="${GITHUB_REF_NAME#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nightingale-tv-server" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: NTV_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
